name: Generate Resume PDFs

on:
  push:
    branches: [main]
    paths:
      - 'src/content/resume*.md'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libasound2t64

      - run: npm ci

      - run: npm run build

      - name: Start server
        run: npx astro preview &

      - name: Wait for server
        run: npx wait-on http://localhost:4321 --timeout 30000

      - name: Generate PDFs
        run: npm run resume

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume*.pdf
          git diff --staged --quiet || git commit -m "chore: regenerate resume PDFs [skip ci]"
          git push
